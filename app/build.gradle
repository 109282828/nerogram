plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nerogram'
    compileSdk 33

    defaultConfig {
        applicationId "com.nerogram"
        minSdk 21 // Понизили до Android 5.0, чтобы встало на любой телефон
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
}
