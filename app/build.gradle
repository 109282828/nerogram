plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nerogram'
    compileSdk 34

    defaultConfig {
        applicationId "com.nerogram"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Добавляем это, чтобы не было ошибок с подписью
    signingConfigs {
        debug {
            storeFile file('debug.keystore') // Если его нет, генерировать не надо, Gradle сам подставит
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
}
